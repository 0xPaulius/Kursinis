####################################################################
# Loki konfigūracija vertinimui (docker compose --profile eval)
#
# Skirtumai nuo gyvo config/loki/loki.yml:
#   - schema nuo 2015-01-01, kad tilptų istorinių rinkinių laiko žymos
#   - reject_old_samples: false — rinkiniai įkeliami su originaliu laiku
#   - retencija išjungta, didesni įkėlimo limitai
#   - ingester.query_store_max_look_back_period: -1 — ką tik įkeltos senos
#     laiko žymos dar gyvena ingesteryje, todėl užklausos turi eiti ir į jį.
#     Vieno proceso režime Loki šią reikšmę nustato pats (~2h41m) ir ji
#     nustelbia querier.query_ingesters_within, tad be jos istoriniai
#     duomenys iki ingesterio flush'o būtų „nematomi"
# max_entries_limit_per_query paliktas 5000, kad detektorius matytų tą patį
# kaip gyvai (jo query_range limit=5000).
####################################################################

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2015-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

limits_config:
  reject_old_samples: false
  retention_period: 0s
  max_query_length: 0
  ingestion_rate_mb: 256
  ingestion_burst_size_mb: 512
  per_stream_rate_limit: 256MB
  per_stream_rate_limit_burst: 512MB
  max_streams_per_user: 0
  max_entries_limit_per_query: 5000

ingester:
  query_store_max_look_back_period: -1

compactor:
  working_directory: /loki/compactor
  retention_enabled: false

analytics:
  reporting_enabled: false
