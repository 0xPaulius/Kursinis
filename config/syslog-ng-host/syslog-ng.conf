@version: 4.11
@include "scl.conf"

####################################################################
# Host syslog-ng -> Kursinis kolektorius (syslog-ng konteineris)
#
# Skaito systemd journal ir persiunčia VISUS žurnalus į kolektorių
# per TCP 514. Naudojamas BSD/RFC3164 formatas (network() numatytasis),
# kad kolektoriaus tcp() šaltinis teisingai atpažintų HOST lauką
# (RFC5424 atveju HOST tampa konteinerio gateway IP).
#
# TLS režimas (COLLECTOR_TLS=1 setup-host-syslog-ng.sh): transport("tcp")
# pakeičiamas į transport("tls") su CA patikra, prievadas — 6514.
#
# journald lieka veikti lokaliai (journalctl) — čia tik persiuntimas.
####################################################################

options {
    keep_hostname(yes);
    use_dns(no);
    chain_hostnames(off);
};

# ---- Šaltinis: systemd journal (visi servisai, kernel, auth ir kt.) ----
source s_host {
    system();      # modernioje Linux sistemoje = systemd-journal()
    internal();    # paties syslog-ng vidiniai pranešimai
};

# ---- Paskirtis: Kursinis kolektorius ----
# Konteineris publikuoja 514 ant host'o, todėl 127.0.0.1 veikia iš host'o.
destination d_collector {
    network(
        "127.0.0.1"
        transport("tcp")
        port(514)
    );
};

# ---- Log kelias: viskas -> kolektorius ----
log {
    source(s_host);
    destination(d_collector);
};
