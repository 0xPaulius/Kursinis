####################################################################
# syslog-ng konfigūracija
# Centrinis žurnalų kolektorius mažai organizacijai
#
# Priima logus per:
#   - UDP 514 (tinklo įrenginiai: MikroTik, Ubiquiti, Cisco)
#   - TCP 514 (Linux rsyslog, patikimesnis transportas)
#   - TCP 1514 (alternatyvus portas)
#
# Persiunčia į:
#   - Alloy per failų sistemą (/var/log/syslog-ng/)
#   - Logus rašo į failus: visi, saugumo ir klaidų (po failą savaitės dienai)
####################################################################

@version: 4.8
@include "scl.conf"

# ---- Globalūs nustatymai ----
options {
    chain_hostnames(off);
    flush_lines(0);
    use_dns(no);
    use_fqdn(no);
    dns_cache(no);
    owner("root");
    group("adm");
    perm(0640);
    stats(freq(0));
    keep_hostname(yes);
    create_dirs(yes);
};

# ---- Šaltiniai (Sources) ----

# Vietiniai logai iš paties konteinerio
source s_local {
    internal();
};

# Syslog priėmimas iš tinklo - pagrindinis portas
source s_network {
    # UDP - tinklo įrenginiai (MikroTik, switch'ai, AP)
    udp(
        ip("0.0.0.0")
        port(514)
    );
    # TCP - Linux serveriai, patikimesnis
    tcp(
        ip("0.0.0.0")
        port(514)
        max-connections(100)
    );
    # Alternatyvus TCP portas
    tcp(
        ip("0.0.0.0")
        port(1514)
        max-connections(100)
    );
};

# ---- Filtrai ----

# Pagal severity
filter f_emergency   { level(emerg); };
filter f_alert       { level(alert); };
filter f_critical    { level(crit); };
filter f_error       { level(err..emerg); };
filter f_warning     { level(warning); };
filter f_notice      { level(notice); };
filter f_info        { level(info); };
filter f_debug       { level(debug); };

# Pagal facility
filter f_auth        { facility(auth, authpriv); };
filter f_kern        { facility(kern); };
filter f_mail        { facility(mail); };
filter f_local       { facility(local0..local7); };

# Saugumo filtrai - potencialiai pavojingi įvykiai.
# Būsenos įrašai (kursinis-status) praleidžiami: procesų varduose gali būti „denied", „blocked" ir pan.
filter f_security {
    not program("kursinis-status") and (
    match("Failed password" value("MESSAGE")) or
    match("authentication failure" value("MESSAGE")) or
    match("Invalid user" value("MESSAGE")) or
    match("BREAK-IN ATTEMPT" value("MESSAGE")) or
    match("refused connect" value("MESSAGE")) or
    match("unauthorized" value("MESSAGE")) or
    match("denied" value("MESSAGE")) or
    match("blocked" value("MESSAGE")) or
    match("attack" value("MESSAGE")) or
    match("DROP" value("MESSAGE")) or
    match("REJECT" value("MESSAGE"))
    );
};

# ---- Paskirties vietos (Destinations) ----
#
# Laikas — gavimo (${R_ISODATE}), ne siuntėjo: RFC3164 žyma neturi laiko zonos, o
# konteineris veikia UTC, tad Vilniaus laiku siunčiantis įrenginys atrodytų 2–3 val.
# „ateityje" ir Loki tokias eilutes atmestų.
#
# Failai pagal savaitės dieną: overwrite-if-older() perrašo praėjusios savaitės failą
# (518000 s — kiek mažiau nei 6 d.), tad diske lieka ne daugiau 7 dienų žalių žurnalų.
# Ilgalaikė kopija — Loki (30 d. retencija).

# Visi logai į vieną failą (Alloy skaitys)
destination d_all {
    file(
        "/var/log/syslog-ng/all-${R_WEEKDAY}.log"
        overwrite-if-older(518000)
        template("${R_ISODATE} ${HOST} ${FACILITY}.${LEVEL} ${PROGRAM}[${PID}]: ${MESSAGE}\n")
    );
};

# Saugumo logai atskirai
destination d_security {
    file(
        "/var/log/syslog-ng/security-${R_WEEKDAY}.log"
        overwrite-if-older(518000)
        template("${R_ISODATE} ${HOST} ${FACILITY}.${LEVEL} ${PROGRAM}[${PID}]: ${MESSAGE}\n")
    );
};

# Error ir aukščiau - atskiras failas
destination d_errors {
    file(
        "/var/log/syslog-ng/errors-${R_WEEKDAY}.log"
        overwrite-if-older(518000)
        template("${R_ISODATE} ${HOST} ${FACILITY}.${LEVEL} ${PROGRAM}[${PID}]: ${MESSAGE}\n")
    );
};

# ---- Log keliai (Log paths) ----

# Visus tinklo logus rašome į bendrą failą
log {
    source(s_network);
    destination(d_all);
};

# Saugumo logai atskirai
log {
    source(s_network);
    filter(f_security);
    destination(d_security);
};

# Klaidų logai atskirai (error ir aukščiau)
log {
    source(s_network);
    filter(f_error);
    destination(d_errors);
};

# Pastaba: paties syslog-ng vidiniai (internal()) logai NĖRA rašomi į d_all,
# kad konteinerio ID (pvz. 84ca94da45fe) neatsirastų kaip „įrenginys" žemėlapyje.

# ---- Pasirenkami priedai (pvz. TLS priėmimas 6514) ----
# conf.d/tls.conf.example -> conf.d/tls.conf, kai sugeneruoti sertifikatai
# (tools/gen-certs.sh). Tuščias katalogas nėra klaida — bazinė konfigūracija veikia ir be jo.
@include "conf.d/*.conf"
