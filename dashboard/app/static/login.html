<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prisijungimas — Logų analizė</title>
<script src="/static/js/theme-boot.js"></script>
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/fonts/fonts.css">
<script src="/static/js/tailwind.min.js"></script>
<script src="/static/js/tailwind.config.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-sm">
  <div class="text-center mb-6">
    <div class="inline-flex items-center justify-center w-11 h-11 rounded-md bg-accent mb-3">
      <span class="material-symbols-outlined ms-fill text-white text-[24px]">security</span>
    </div>
    <h1 class="text-[18px] font-medium text-strong">Logų analizė</h1>
    <p class="text-muted mt-1">Prisijunkite prie sistemos</p>
  </div>

  <div class="panel p-6">
    <form id="login-form" novalidate class="space-y-4">
      <div id="error-banner" class="hidden banner is-error">
        <span class="material-symbols-outlined ms-fill text-[17px] text-crit shrink-0">error</span>
        <span id="error-text"></span>
      </div>

      <div>
        <label for="username" class="lbl">Vartotojo vardas</label>
        <input id="username" name="username" type="text" autocomplete="username" maxlength="64"
          class="input" placeholder="admin">
        <p id="username-err" class="hidden mt-1 text-[12px] text-crit"></p>
      </div>

      <div>
        <label for="password" class="lbl">Slaptažodis</label>
        <div class="relative">
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128"
            class="input pr-16" placeholder="••••••••">
          <button type="button" id="toggle-pw" class="link-btn absolute right-2 top-1/2 -translate-y-1/2 select-none">Rodyti</button>
        </div>
        <p id="password-err" class="hidden mt-1 text-[12px] text-crit"></p>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary w-full h-9 justify-center">Prisijungti</button>
    </form>
  </div>

  <p class="text-center text-[12px] text-dim mt-5">
    Logų analizės ir anomalijų aptikimo sistema &mdash; VU ISKS kursinis darbas
  </p>
</div>

<script type="module" src="/static/js/login.js"></script>
</body>
</html>
