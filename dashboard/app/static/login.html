<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prisijungimas — Logų analizė</title>
<script src="/static/js/tailwind.min.js"></script>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "surface":                  "#fbf8ff",
        "surface-container-lowest": "#ffffff",
        "surface-container-low":    "#f4f2fd",
        "surface-container":        "#eeedf7",
        "surface-container-high":   "#e8e7f1",
        "on-surface":               "#1a1b22",
        "on-surface-variant":       "#47464a",
        "outline":                  "#78767b",
        "outline-variant":          "#c8c5ca",
        "primary":                  "#000000",
        "on-primary":               "#ffffff",
        "primary-container":        "#1c1b1d",
        "on-primary-container":     "#858386",
        "secondary":                "#006c4a",
        "on-secondary":             "#ffffff",
        "secondary-container":      "#82f5c1",
        "on-secondary-container":   "#00714e",
        "error":                    "#ba1a1a",
        "on-error":                 "#ffffff",
        "error-container":          "#ffdad6",
        "on-error-container":       "#93000a",
      },
      fontFamily: {
        headline: ["Manrope", "sans-serif"],
        body:     ["Inter",   "sans-serif"],
        label:    ["Inter",   "sans-serif"],
      },
    },
  },
};
</script>
<style>
  .material-symbols-outlined { font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24; }
  body { font-family:'Inter',sans-serif; }
</style>
</head>
<body class="min-h-screen bg-surface flex items-center justify-center font-body p-4 text-on-surface">

<div class="w-full max-w-sm">
  <!-- Logo / title -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-primary mb-4">
      <span class="material-symbols-outlined text-on-primary text-[28px]">security</span>
    </div>
    <h1 class="text-2xl font-bold font-headline text-primary">Logų analizė</h1>
    <p class="text-sm text-on-surface-variant mt-1">Prisijunkite prie sistemos</p>
  </div>

  <!-- Card -->
  <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant p-8">
    <form id="login-form" novalidate>
      <!-- Error banner -->
      <div id="error-banner" class="hidden mb-4 px-4 py-3 rounded-lg bg-error-container border border-error/30 flex items-center gap-2">
        <span class="material-symbols-outlined text-on-error-container text-[18px] shrink-0">error</span>
        <span id="error-text" class="text-sm text-on-error-container"></span>
      </div>

      <!-- Username -->
      <div class="mb-4">
        <label for="username" class="block text-xs font-bold uppercase tracking-wider font-label text-on-surface-variant mb-1.5">
          Vartotojo vardas
        </label>
        <input id="username" name="username" type="text" autocomplete="username"
          maxlength="64"
          class="w-full px-3.5 py-2.5 rounded-lg bg-surface-container-lowest border border-outline-variant text-sm text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary transition"
          placeholder="admin">
        <p id="username-err" class="hidden mt-1 text-xs text-error"></p>
      </div>

      <!-- Password -->
      <div class="mb-6">
        <label for="password" class="block text-xs font-bold uppercase tracking-wider font-label text-on-surface-variant mb-1.5">
          Slaptažodis
        </label>
        <div class="relative">
          <input id="password" name="password" type="password" autocomplete="current-password"
            maxlength="128"
            class="w-full px-3.5 py-2.5 rounded-lg bg-surface-container-lowest border border-outline-variant text-sm text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary transition pr-16"
            placeholder="••••••••">
          <button type="button" id="toggle-pw"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition text-xs font-bold uppercase tracking-wide select-none">
            Rodyti
          </button>
        </div>
        <p id="password-err" class="hidden mt-1 text-xs text-error"></p>
      </div>

      <!-- Submit -->
      <button type="submit" id="submit-btn"
        class="w-full py-2.5 rounded-lg bg-primary text-on-primary text-sm font-bold hover:opacity-90 active:opacity-100 transition disabled:opacity-50 disabled:cursor-not-allowed">
        Prisijungti
      </button>
    </form>
  </div>

  <p class="text-center text-xs text-on-surface-variant mt-6">
    Logų analizės ir anomalijų aptikimo sistema &mdash; VU ISKS kursinis darbas
  </p>
</div>

<script>
(function () {
  // If already logged in, redirect to dashboard
  if (sessionStorage.getItem("auth_token")) {
    window.location.replace("/");
    return;
  }

  const form     = document.getElementById("login-form");
  const userEl   = document.getElementById("username");
  const passEl   = document.getElementById("password");
  const btnEl    = document.getElementById("submit-btn");
  const errBanner= document.getElementById("error-banner");
  const errText  = document.getElementById("error-text");
  const userErr  = document.getElementById("username-err");
  const passErr  = document.getElementById("password-err");
  const togglePw = document.getElementById("toggle-pw");

  togglePw.addEventListener("click", () => {
    const show = passEl.type === "password";
    passEl.type     = show ? "text" : "password";
    togglePw.textContent = show ? "Slėpti" : "Rodyti";
  });

  function clearErrors() {
    errBanner.classList.add("hidden");
    userErr.classList.add("hidden");
    passErr.classList.add("hidden");
    userEl.classList.remove("border-red-400");
    passEl.classList.remove("border-red-400");
  }

  function showFieldError(fieldEl, errEl, msg) {
    fieldEl.classList.add("border-red-400");
    errEl.textContent = msg;
    errEl.classList.remove("hidden");
  }

  function showBannerError(msg) {
    errText.textContent = msg;
    errBanner.classList.remove("hidden");
  }

  function validate() {
    let ok = true;
    clearErrors();
    if (!userEl.value.trim()) {
      showFieldError(userEl, userErr, "Vartotojo vardas negali būti tuščias");
      ok = false;
    }
    if (!passEl.value) {
      showFieldError(passEl, passErr, "Slaptažodis negali būti tuščias");
      ok = false;
    }
    return ok;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!validate()) return;

    btnEl.disabled = true;
    btnEl.textContent = "Jungiamasi...";

    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: userEl.value.trim(),
          password: passEl.value,
        }),
      });

      if (res.ok) {
        const data = await res.json();
        sessionStorage.setItem("auth_token",  data.token);
        sessionStorage.setItem("auth_user",   data.username);
        window.location.replace("/");
      } else {
        const err = await res.json().catch(() => ({}));
        if (res.status === 401) {
          showBannerError(err.detail || "Neteisingas vartotojo vardas arba slaptažodis");
          passEl.value = "";
          passEl.focus();
        } else if (res.status === 400) {
          showBannerError(err.detail || "Užpildykite visus laukus");
        } else {
          showBannerError("Serverio klaida. Bandykite vėliau.");
        }
      }
    } catch {
      showBannerError("Nepavyko prisijungti prie serverio. Patikrinkite ryšį.");
    } finally {
      btnEl.disabled = false;
      btnEl.textContent = "Prisijungti";
    }
  });
}());
</script>
</body>
</html>
