####################################################################
# Centralizuota žurnalų analizės ir anomalijų aptikimo sistema
# mažoms organizacijoms
#
# Stack: syslog-ng → Alloy → Loki → Grafana + Python anomaly detector
#
# Portai:
#   514/TCP,UDP  - syslog priėmimas (iš tinklo įrenginių, serverių)
#   3100         - Loki API (vidinis, Alloy → Loki)
#   3000         - Grafana web UI
####################################################################

services:

  # ============================================================
  # 1. SYSLOG-NG - Centrinis žurnalų kolektorius
  #    Priima syslog žinutes per TCP/UDP iš viso tinklo
  # ============================================================
  syslog-ng:
    image: balabit/syslog-ng:4.8.3
    container_name: syslog-ng
    restart: unless-stopped
    ports:
      - "514:514/udp"     # Syslog UDP (tinklo įrenginiai, Linux rsyslog)
      - "514:514/tcp"     # Syslog TCP (patikimesnis transportas)
      - "1514:1514/tcp"   # Alternatyvus portas (jei 514 užimtas)
      - "6514:6514/tcp"   # Syslog per TLS (įjungiamas conf.d/tls.conf)
    volumes:
      - ./config/syslog-ng/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
      - ./config/syslog-ng/conf.d:/etc/syslog-ng/conf.d:ro
      - ./certs:/etc/syslog-ng/tls:ro
      - syslog-ng-logs:/var/log/syslog-ng
    networks:
      - lognet
    healthcheck:
      test: ["CMD", "syslog-ng-ctl", "stats"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # 2. ALLOY - Logų siuntėjas į Loki (pakeitė Promtail)
  #    Skaito syslog-ng failus, prideda labels ir siunčia į Loki.
  #    promtail-positions prijungtas tik skaitymui: legacy_positions_file
  #    vieną kartą perima Promtail pozicijas, kad failai nebūtų skaitomi iš naujo.
  # ============================================================
  alloy:
    image: grafana/alloy:v1.20.1
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345   # /-/ready dashboard'o būklės patikrai
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./config/alloy/collector.alloy:/etc/alloy/config.alloy:ro
      - syslog-ng-logs:/var/log/syslog-ng:ro
      - alloy-data:/var/lib/alloy/data
      - promtail-positions:/var/lib/promtail:ro
    networks:
      - lognet
    depends_on:
      - loki
      - syslog-ng

  # ============================================================
  # 2b. ALLOY GATEWAY - Galinių įrenginių (Windows) žurnalų priėmimas
  #    Loki push API per TLS + kliento sertifikatus (mTLS) į :3500.
  #    Atskiras profilis: be sertifikatų (tools/gen-certs.sh) nepaleidžiamas,
  #    kad bazinis stack'as veiktų ir be endpoint'ų.
  #    docker compose --profile endpoints up -d
  # ============================================================
  alloy-gateway:
    image: grafana/alloy:v1.20.1
    container_name: alloy-gateway
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "3500:3500"       # Endpoint'ų Loki push (HTTPS, mTLS)
    volumes:
      - ./config/alloy/gateway.alloy:/etc/alloy/config.alloy:ro
      - ./certs:/etc/alloy/certs:ro
    networks:
      - lognet
    depends_on:
      - loki
    profiles:
      - endpoints

  # ============================================================
  # 3. LOKI - Žurnalų saugykla
  #    Lengva, indeksuoja tik metaduomenis (labels),
  #    pats turinys saugomas efektyviai
  # ============================================================
  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    restart: unless-stopped
    volumes:
      - ./config/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - lognet
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ============================================================
  # 4. GRAFANA - Vizualizacija ir alertai
  #    Web dashboard, Loki data source automatiškai sukonfigūruotas
  # ============================================================
  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ALERTING_ENABLED=true
      - GF_UNIFIED_ALERTING_ENABLED=true
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - lognet
    depends_on:
      - loki

  # ============================================================
  # 5. ANOMALY DETECTOR - Python anomalijų aptikimo modulis
  #    Periodiškai query'ina Loki API, analizuoja logus,
  #    siunčia alertus
  # ============================================================
  anomaly-detector:
    build:
      context: ./anomaly-detector
      dockerfile: Dockerfile
      target: runtime
    container_name: anomaly-detector
    restart: unless-stopped
    environment:
      - LOKI_URL=http://loki:3100
      - CHECK_INTERVAL=5           # Tikrinimo intervalas sekundėmis (demonstracijai — greiti alertai)
      - SSH_BRUTE_THRESHOLD=5      # Max nesėkmingų SSH per langą
      - LOG_SPIKE_MULTIPLIER=3.0   # Kiek kartų viršyti vidurkį = spike
      - ENABLE_ML=false            # ML sluoksnis gyvai išjungtas (per daug klaidingų teigiamų)
      - ALERT_WEBHOOK_URL=         # Telegram/Slack webhook (optional)
    volumes:
      - ./anomaly-detector:/app:ro
      - anomaly-data:/data
    networks:
      - lognet
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/detector.alive && [ $(( $(date +%s) - $(stat -c %Y /tmp/detector.alive) )) -lt 120 ] || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - anomaly   # docker compose --profile anomaly up -d

  # ============================================================
  # 6. DASHBOARD - Stebėjimo pultas (vartotojo sąsaja)
  #    Paprasta lietuviška web UI žurnalams ir įspėjimams peržiūrėti
  # ============================================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - LOKI_URL=http://loki:3100
      - ANOMALY_DB_PATH=/data/anomaly_history.json
      - DEVICES_DB_PATH=/state/devices.json
      - SYSLOG_HOST=syslog-ng       # Demonstracinio srauto siuntimas į kolektorių
      - SYSLOG_PORT=514
      - SYNTHETIC_TRAFFIC=${SYNTHETIC_TRAFFIC:-true}   # laboratorijos eksperimentams: false
      - ALLOY_READY_URL=http://alloy:12345/-/ready   # Alloy būklės patikra
      - HOST_INFO_DIR=/host         # Savo serverio (host) info skaitymui
      # Autentifikacija: pirmas admin sukuriamas iš šių kintamųjų (saugoma scrypt maiša /state).
      - DASHBOARD_ADMIN_USER=${DASHBOARD_ADMIN_USER:-admin}
      - DASHBOARD_ADMIN_PASSWORD=${DASHBOARD_ADMIN_PASSWORD:-admin123}
      - DASHBOARD_SECRET_KEY=${DASHBOARD_SECRET_KEY:-}
    volumes:
      - anomaly-data:/data:ro
      - dashboard-state:/state      # Registruoti įrenginiai (rašoma)
      # Savo serverio branduolio/OS versija įrenginių žemėlapiui (tik Linux host).
      # Jei šių kelių nėra (ne-Linux host), užkomentuokite — žemėlapis veiks be jų.
      - /etc/hostname:/host/hostname:ro
      - /etc/os-release:/host/os-release:ro
      - /proc/version:/host/version:ro
    networks:
      - lognet
    depends_on:
      loki:
        condition: service_healthy
      syslog-ng:
        condition: service_started
      alloy:
        condition: service_started

  # ============================================================
  # 7. LOKI-EVAL + EVALUATOR - Offline aptikimo vertinimas
  #    Atskiras Loki su originaliomis rinkinių laiko žymomis ir
  #    detektorius virtualiu laikrodžiu (evaluation paketas).
  #    docker compose --profile eval run --rm evaluator <komanda>
  # ============================================================
  loki-eval:
    image: grafana/loki:3.4.2
    container_name: loki-eval
    restart: unless-stopped
    volumes:
      - ./config/loki/loki-eval.yml:/etc/loki/local-config.yaml:ro
      - loki-eval-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - lognet
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    profiles:
      - eval

  evaluator:
    build:
      context: ./anomaly-detector
      dockerfile: Dockerfile
      target: eval
    container_name: evaluator
    user: "${EVAL_UID:-1000}:${EVAL_GID:-1000}"   # rezultatų failai priklauso host vartotojui
    environment:
      - LOKI_URL=http://loki-eval:3100
      - EVAL_RESULTS=/results
      - EVAL_DATASETS=/datasets
      - GIT_SHA=${GIT_SHA:-unknown}
      - MPLCONFIGDIR=/tmp/matplotlib
    volumes:
      - ./anomaly-detector:/app:ro
      - ./datasets:/datasets
      - ./eval-results:/results
    networks:
      - lognet
    depends_on:
      loki-eval:
        condition: service_healthy
    profiles:
      - eval

# ============================================================
# TINKLAI IR VOLUMES
# ============================================================
networks:
  lognet:
    driver: bridge

volumes:
  loki-data:
    driver: local
  grafana-data:
    driver: local
  syslog-ng-logs:
    driver: local
  anomaly-data:
    driver: local
  dashboard-state:
    driver: local
  promtail-positions:
    driver: local
  alloy-data:
    driver: local
  loki-eval-data:
    driver: local
